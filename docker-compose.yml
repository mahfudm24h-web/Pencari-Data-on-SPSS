# Production stack for a VPS that already runs Traefik (Hostinger "Docker and Traefik" template).
# That Traefik runs in host network mode and discovers containers through the Docker socket,
# so the app only needs its own default network; no shared Traefik network is required.
# Settings come from the .env file next to this file; see .env.example.
services:
  app:
    image: ${APP_IMAGE:-spss-datascout:local}
    build: ${APP_BUILD_CONTEXT:-.}
    # Build on the server when no ready-made image (APP_IMAGE) is set; managed Docker UIs run `up` without --build.
    pull_policy: ${APP_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://datascout:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/datascout
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-}
      GEMINI_MODEL_DEEP: ${GEMINI_MODEL_DEEP:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DAILY_SEARCH_LIMIT: ${DAILY_SEARCH_LIMIT:-20}
      DAILY_DEEP_LIMIT: ${DAILY_DEEP_LIMIT:-5}
    labels:
      - traefik.enable=true
      - traefik.http.routers.datascout.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)
      - traefik.http.routers.datascout.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.datascout.tls=true
      - traefik.http.routers.datascout.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.datascout.loadbalancer.server.port=3000

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datascout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: datascout
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datascout -d datascout"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
