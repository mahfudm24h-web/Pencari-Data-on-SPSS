# Production stack for a VPS that already runs Traefik (Hostinger "Docker and Traefik" template).
# Settings come from the .env file next to this file; see .env.example.
services:
  app:
    image: ${APP_IMAGE:-spss-datascout:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://datascout:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/datascout
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-}
      GEMINI_MODEL_DEEP: ${GEMINI_MODEL_DEEP:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BPS_API_KEY: ${BPS_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DAILY_SEARCH_LIMIT: ${DAILY_SEARCH_LIMIT:-20}
      DAILY_DEEP_LIMIT: ${DAILY_DEEP_LIMIT:-5}
      DAILY_CHAT_LIMIT: ${DAILY_CHAT_LIMIT:-50}
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in .env}
      - traefik.http.routers.datascout.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)
      - traefik.http.routers.datascout.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.datascout.tls=true
      - traefik.http.routers.datascout.tls.certresolver=${TRAEFIK_CERTRESOLVER:?Set TRAEFIK_CERTRESOLVER in .env}
      - traefik.http.services.datascout.loadbalancer.server.port=3000

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datascout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: datascout
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datascout -d datascout"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
  proxy:
    name: ${TRAEFIK_NETWORK}
    external: true
